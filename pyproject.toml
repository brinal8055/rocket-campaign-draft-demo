[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rocket-campaign-draft-demo"
version = "0.1.0"
description = "Scaffold for a brief-to-Google-Ads paused draft demo."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "google-ads>=27.0.0,<28.0.0",
  "google-auth-oauthlib>=1.2.0,<2.0.0",
  "langsmith>=0.1.141,<1.0.0",
  "openai>=1.108.0,<2.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "python-dotenv>=1.0,<2.0",
  "rich>=13.7,<14.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["."]
testpaths = ["tests"]
